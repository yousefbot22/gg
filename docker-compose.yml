version: '3.9'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: qureo-bot:2.0.0
    container_name: qureo-bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      HEADLESS: "true"
      PYTHONUNBUFFERED: "1"
      PORT: "8080"

    ports:
      - "8080:8080"

    volumes:
      # Persist data across restarts
      - ./data:/app/data
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      # Optional: mount firebase credentials
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro

    # Chromium needs extra shared memory
    ipc: host
    shm_size: "1gb"

    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3