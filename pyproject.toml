[project]
name = "qureo-solution-bot"
version = "2.0.0"
description = "Qureo Learning Platform Solver Bot"
requires-python = ">=3.11"
authors = [{ name = "Mina Shehata" }]

dependencies = [
    "aiogram>=3.13.0",
    "playwright>=1.48.0",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.1",
    "firebase-admin>=6.5.0",
    "aiohttp>=3.10.0",
    "Pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true